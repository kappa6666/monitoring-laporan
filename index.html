<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Kelengkapan Data</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">
    <!-- Top Bar / Header -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-600 rounded-lg">
                    <i data-lucide="activity" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Monitoring Data Lokal</h1>
                    <p class="text-xs text-slate-400">Pengolahan & Monitoring Otomatis PGNCOM</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3 w-full sm:w-auto justify-end">
                <button onclick="fetchLiveData()" class="flex-1 sm:flex-initial inline-flex items-center justify-center px-4 py-2.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-white text-sm font-semibold rounded-xl transition duration-150 shadow-sm gap-2 border border-slate-700">
                    <i data-lucide="refresh-cw" class="w-4 h-4" id="refreshIcon"></i>
                    <span>Muat Ulang Data</span>
                </button>
                
                <button onclick="copyForWA()" class="flex-1 sm:flex-initial inline-flex items-center justify-center px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white text-sm font-semibold rounded-xl transition duration-150 shadow-sm gap-2">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                    <span>Copas Teks WA</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 space-y-6">
        <!-- Status Indicator Bar -->
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3 text-xs sm:text-sm text-slate-600">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
                    <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                    Dashboard Aktif
                </span>
                <span id="lastUpdated" class="text-slate-500">Terakhir Diperbarui: Memuat data...</span>
            </div>
        </div>

        <!-- Summary Cards Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500">Total Tidak Lengkap</p>
                    <p class="text-2xl font-bold text-slate-900 mt-1" id="totalCount">0</p>
                </div>
                <div class="p-3 bg-rose-50 rounded-xl text-rose-600">
                    <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500">Hourly Belum Complete</p>
                    <p class="text-2xl font-bold text-amber-600 mt-1" id="hourlyCount">0</p>
                </div>
                <div class="p-3 bg-amber-50 rounded-xl text-amber-600">
                    <i data-lucide="clock" class="w-6 h-6"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500">Daily Belum Complete</p>
                    <p class="text-2xl font-bold text-indigo-600 mt-1" id="dailyCount">0</p>
                </div>
                <div class="p-3 bg-indigo-50 rounded-xl text-indigo-600">
                    <i data-lucide="calendar" class="w-6 h-6"></i>
                </div>
            </div>
        </div>

        <!-- Search Bar Filter -->
        <div class="relative">
            <i data-lucide="search" class="w-5 h-5 absolute left-3.5 top-3.5 text-slate-400"></i>
            <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Cari nama pelanggan / perusahaan..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm">
        </div>

        <!-- Data Display Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
